<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>한줄일기</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preload" href="./composeResources/com.onelinediary.app.generated.resources/font/pretendard_regular.otf" as="fetch" type="font/otf" crossorigin>
    <link rel="preload" href="./composeResources/com.onelinediary.app.generated.resources/font/pretendard_bold.otf" as="fetch" type="font/otf" crossorigin>
    <link rel="preload" href="./composeResources/com.onelinediary.app.generated.resources/font/noto_sans_symbols2.ttf" as="fetch" type="font/ttf" crossorigin>
    <meta name="theme-color" content="#101426">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #090A10;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        input, textarea {
            user-select: text !important;
            -webkit-user-select: text !important;
        }
        @font-face {
            font-family: 'Pretendard';
            src: url('./composeResources/com.onelinediary.app.generated.resources/font/pretendard_regular.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }
        .wasm-diary-input {
            position: fixed;
            background-color: #16192E !important;
            color: #F0F4FF !important;
            border: 1px solid rgba(130, 177, 255, 0.35) !important;
            border-radius: 16px !important;
            padding: 0 16px !important;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important;
            font-size: 15px !important;
            line-height: 22px !important;
            outline: none !important;
            box-sizing: border-box !important;
            z-index: 10 !important;
            caret-color: #82B1FF !important;
            transition: border-color 0.2s ease, box-shadow 0.2s ease !important;
        }
        .wasm-diary-input:focus {
            border-color: #82B1FF !important;
            box-shadow: 0 0 12px rgba(130, 177, 255, 0.25) !important;
        }
        .wasm-diary-input::placeholder {
            color: rgba(139, 149, 184, 0.6) !important;
        }
        #root {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #101426 0%, #090A10 100%);
            z-index: 9999;
            transition: opacity 0.8s ease-out;
        }
        .star-loader {
            font-size: 32px;
            color: #82B1FF;
            animation: pulse 2s infinite ease-in-out;
            margin-bottom: 16px;
        }
        .loading-title {
            font-size: 18px;
            font-weight: 600;
            color: #F0F4FF;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .loading-desc {
            font-size: 13px;
            color: #8B95B8;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.4; }
            50% { transform: scale(1.1); opacity: 1; text-shadow: 0 0 16px #82B1FF; }
            100% { transform: scale(0.9); opacity: 0.4; }
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="star-loader">✦</div>
        <div class="loading-title">한줄일기</div>
        <div class="loading-desc">밤하늘을 펼치는 중...</div>
    </div>
    <div id="root"></div>
    <script>
        // Compose Wasm 앱이 마운트되면 로딩 화면을 부드럽게 페이드아웃 제거
        const observer = new MutationObserver((mutations, obs) => {
            const root = document.getElementById('root');
            if (root && root.children.length > 0) {
                const loader = document.getElementById('loading-screen');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 800);
                }
                obs.disconnect();
            }
        });
        observer.observe(document.getElementById('root'), { childList: true, subtree: true });
    </script>
    <script src="composeApp.js"></script>
</body>
</html>
